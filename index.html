<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live GNSS Map</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
html, body, #map { height:100%; margin:0; }
.status {
  position:absolute; top:10px; left:50%;
  transform:translateX(-50%);
  background:#000c; color:#fff;
  padding:6px 12px; font-family:monospace;
  z-index:1000; border-radius:4px;
}
</style>
</head>

<body>
<div id="map"></div>
<div id="status" class="status">Connecting…</div>

<script>
const mqttUrl = "wss://broker.emqx.io:8084/mqtt";
const mqttTopic = "robot/state";
const statusEl = document.getElementById("status");

const client = mqtt.connect(mqttUrl, {
  clientId: "web_map_" + Math.random().toString(16).slice(2),
  clean: true,
  reconnectPeriod: 2000
});

let map = L.map("map").setView([20,0], 3);
L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/" +
  "World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 22 }
).addTo(map);

let marker = null;
let firstFix = true;

client.on("connect", () => {
  statusEl.textContent = "MQTT connected – waiting GNSS…";
  client.subscribe(mqttTopic);
});

client.on("message", (topic, msg) => {
  const data = JSON.parse(msg.toString());

  const lat = Number(data.gnss_lat);
  const lon = Number(data.gnss_lon);

  if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
    statusEl.textContent = "Waiting for GNSS fix…";
    return;
  }

  statusEl.textContent =
    `GNSS FIX | ${lat.toFixed(7)}, ${lon.toFixed(7)}`;

  if (!marker) {
    marker = L.marker([lat, lon]).addTo(map);
  } else {
    marker.setLatLng([lat, lon]);
  }

  if (firstFix) {
    map.setView([lat, lon], 19);
    firstFix = false;
  }
});
</script>
</body>
</html>
