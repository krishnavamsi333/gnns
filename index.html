<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live GNSS Map</title>

<!-- Leaflet -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<!-- MQTT.js -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
html, body, #map {
  height: 100%;
  margin: 0;
}

.status {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.75);
  color: #fff;
  padding: 6px 12px;
  font-family: monospace;
  z-index: 1000;
  border-radius: 4px;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="status" class="status">Starting…</div>

<script>
/* ---------------- CONFIG ---------------- */
const MQTT_URL   = "wss://broker.emqx.io:8084/mqtt";
const MQTT_TOPIC = "robot/state";
/* --------------------------------------- */

const statusEl = document.getElementById("status");

/* ---------------- MAP INIT ---------------- */
const map = L.map("map", {
  minZoom: 3,
  maxZoom: 22
});

// Try to restore last known position
const lastLat = Number(localStorage.getItem("last_lat"));
const lastLon = Number(localStorage.getItem("last_lon"));

if (Number.isFinite(lastLat) && Number.isFinite(lastLon)) {
  map.setView([lastLat, lastLon], 16);
} else {
  map.setView([20, 0], 3); // world view
}

L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/" +
  "World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 22 }
).addTo(map);

let marker = null;
let firstFix = true;

/* ---------------- MQTT ---------------- */
const client = mqtt.connect(MQTT_URL, {
  clientId: "web_map_" + Math.random().toString(16).slice(2),
  clean: true,
  reconnectPeriod: 2000
});

client.on("connect", () => {
  console.log("✅ MQTT connected");
  statusEl.textContent = "MQTT connected – waiting for GNSS fix…";
  client.subscribe(MQTT_TOPIC);
});

client.on("reconnect", () => {
  statusEl.textContent = "Reconnecting to MQTT…";
});

client.on("offline", () => {
  statusEl.textContent = "MQTT offline";
});

client.on("error", err => {
  console.error("MQTT error:", err);
  statusEl.textContent = "MQTT error – check console";
});

/* ---------------- DATA HANDLER ---------------- */
client.on("message", (topic, message) => {
  let data;
  try {
    data = JSON.parse(message.toString());
  } catch (e) {
    console.error("JSON parse error", e);
    return;
  }

  const lat = Number(data.gnss_lat);
  const lon = Number(data.gnss_lon);

  // -------- GNSS NOT READY (MSP / WARM-UP) --------
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
    statusEl.textContent =
      "GNSS warming up (acquiring satellites)…";
    return;
  }

  // Save last good fix
  localStorage.setItem("last_lat", lat);
  localStorage.setItem("last_lon", lon);

  // -------- GNSS READY --------
  statusEl.textContent =
    `GNSS FIX | ${lat.toFixed(7)}, ${lon.toFixed(7)}`;

  if (!marker) {
    // First fix → create marker and center map
    marker = L.marker([lat, lon]).addTo(map);
    map.setView([lat, lon], 19);
    firstFix = false;
  } else {
    // Update marker position
    marker.setLatLng([lat, lon]);
    map.panTo([lat, lon], { animate: true });
  }
});
</script>

</body>
</html>
